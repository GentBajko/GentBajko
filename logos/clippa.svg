<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="clippa">
  <!-- clippa mark: the two ratios, a 16:9 block (Macro Video) and a 9:16 block (Clip).
       Fill attributes are the fallback for viewers without CSS; the style block overrides them:
       set the clippa-ink variable (e.g. currentColor) and the clippa-accent variable on an
       ancestor when inlined, or let prefers-color-scheme pick the ink when used as an image. -->
  <style>
    .ink { fill: var(--clippa-ink, #241F1B); }
    .accent { fill: var(--clippa-accent, #C9663F); }
    @media (prefers-color-scheme: dark) { .ink { fill: var(--clippa-ink, #F3ECE3); } }
  </style>
  <rect class="ink" fill="#241F1B" x="2" y="8" width="17" height="9.5" rx="3"/>
  <rect class="accent" fill="#C9663F" x="21" y="8" width="9" height="16" rx="3"/>
</svg>
